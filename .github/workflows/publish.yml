name: Publish

on:
  schedule:
    # Every day 10:10 Europe/Istanbul (07:10 UTC). GitHub can delay or drop scheduled runs,
    # so two backup runs follow; a run with nothing pending exits without posting.
    - cron: '10 7 * * *'
    - cron: '40 9 * * *'
    - cron: '10 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = verify credentials only, dry-run = show next post, publish = really publish'
        type: choice
        options: [check, dry-run, publish]
        default: check
      post_id:
        description: 'Publish this post id instead of the oldest due one (optional)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch head at run time, not the trigger commit, so a queued run sees state saved by the previous one.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node tools/lint.mjs --images
      - name: Publish due post
        env:
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
          POST_ID: ${{ inputs.post_id }}
        run: |
          args=()
          [ "$MODE" = "dry-run" ] && args+=(--dry-run)
          [ "$MODE" = "check" ] && args+=(--check)
          [ -n "$POST_ID" ] && args+=(--id "$POST_ID")
          node tools/publish.mjs "${args[@]}"
      - name: Save publish state
        if: always()
        run: |
          git diff --quiet -- state/ && exit 0
          git config user.name "jurvia-social-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "Record published post"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
