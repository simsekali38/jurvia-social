name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node tools/lint.mjs --images
      - name: Warn when the queue is running low
        run: PUBLIC_BASE_URL=unused node tools/publish.mjs --dry-run --id __queue_status__ || true
