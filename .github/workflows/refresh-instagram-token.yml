name: Refresh Instagram token

# Instagram-login tokens (IG...) last 60 days; refreshing weekly keeps them alive (needs SECRETS_PAT:
# a fine-grained token for this repository with "Secrets: Read and write").
# Facebook/business tokens (EAA...) cannot be refreshed this way: the job checks weekly that the token
# still works and fails otherwise, so GitHub e-mails a reminder.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh and store token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          IG_API_HOST: https://graph.instagram.com
        run: |
          set -euo pipefail
          [ -n "$IG_ACCESS_TOKEN" ] || { echo "IG_ACCESS_TOKEN not set, nothing to refresh"; exit 0; }
          IG_ACCESS_TOKEN=$(printf '%s' "$IG_ACCESS_TOKEN" | tr -d '[:space:]')
          if [[ "$IG_ACCESS_TOKEN" == EAA* ]]; then
            # Facebook-issued tokens cannot be refreshed or self-inspected here: verify they still work.
            code=$(curl -sS -o /tmp/ig.json -w '%{http_code}' -G "https://graph.facebook.com/v23.0/$IG_USER_ID" \
              --data-urlencode fields=username --data-urlencode "access_token=$IG_ACCESS_TOKEN")
            [ "$code" = "200" ] || { echo "::error::Instagram token no longer works (HTTP $code): $(jq -c .error /tmp/ig.json). Generate a new token in the Meta app and update IG_ACCESS_TOKEN."; exit 1; }
            echo "Instagram token works for @$(jq -r .username /tmp/ig.json)."
            exit 0
          fi
          [ -n "$GH_TOKEN" ] || { echo "::error::SECRETS_PAT is missing"; exit 1; }
          resp=$(curl -sS --fail-with-body -G "$IG_API_HOST/refresh_access_token" \
            --data-urlencode grant_type=ig_refresh_token --data-urlencode "access_token=$IG_ACCESS_TOKEN") \
            || { echo "::error::Instagram refresh failed: $(echo "$resp" | jq -c .error 2>/dev/null)"; exit 1; }
          token=$(echo "$resp" | jq -r .access_token)
          days=$(( $(echo "$resp" | jq -r .expires_in) / 86400 ))
          echo "::add-mask::$token"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$token"
          echo "Token refreshed, valid for $days days."
