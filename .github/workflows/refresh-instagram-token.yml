name: Refresh Instagram token

# Instagram-login tokens (IG...) last 60 days; refreshing weekly keeps them alive (needs SECRETS_PAT:
# a fine-grained token for this repository with "Secrets: Read and write").
# Facebook/business tokens (EAA...) cannot be refreshed this way: the job reports their expiry and
# fails when fewer than 14 days are left, so GitHub e-mails a reminder in time.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh and store token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          IG_API_HOST: https://graph.instagram.com
        run: |
          set -euo pipefail
          [ -n "$IG_ACCESS_TOKEN" ] || { echo "IG_ACCESS_TOKEN not set, nothing to refresh"; exit 0; }
          IG_ACCESS_TOKEN=$(printf '%s' "$IG_ACCESS_TOKEN" | tr -d '[:space:]')
          if [[ "$IG_ACCESS_TOKEN" == EAA* ]]; then
            info=$(curl -sS -G https://graph.facebook.com/v23.0/debug_token \
              --data-urlencode "input_token=$IG_ACCESS_TOKEN" --data-urlencode "access_token=$IG_ACCESS_TOKEN")
            exp=$(echo "$info" | jq -r '.data.expires_at // empty')
            valid=$(echo "$info" | jq -r '.data.is_valid // empty')
            echo "Facebook token: valid=$valid type=$(echo "$info" | jq -r '.data.type // "?"') expires_at=$exp"
            [ "$valid" = "true" ] || { echo "::error::Instagram token is not valid: $(echo "$info" | jq -c '.error // .data.error // {}')"; exit 1; }
            if [ -z "$exp" ] || [ "$exp" = "0" ]; then echo "Token does not expire."; exit 0; fi
            left=$(( (exp - $(date +%s)) / 86400 ))
            echo "Days left: $left"
            [ "$left" -ge 14 ] || { echo "::error::Instagram token expires in $left days. Generate a new one in the Meta app and update IG_ACCESS_TOKEN."; exit 1; }
            exit 0
          fi
          [ -n "$GH_TOKEN" ] || { echo "::error::SECRETS_PAT is missing"; exit 1; }
          resp=$(curl -sS --fail-with-body -G "$IG_API_HOST/refresh_access_token" \
            --data-urlencode grant_type=ig_refresh_token --data-urlencode "access_token=$IG_ACCESS_TOKEN") \
            || { echo "::error::Instagram refresh failed: $(echo "$resp" | jq -c .error 2>/dev/null)"; exit 1; }
          token=$(echo "$resp" | jq -r .access_token)
          days=$(( $(echo "$resp" | jq -r .expires_in) / 86400 ))
          echo "::add-mask::$token"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$token"
          echo "Token refreshed, valid for $days days."
